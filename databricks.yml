bundle:
  name: preboard

sync:
  exclude:
    - .git
    - .env
    - .env.example
    - vars
    - misses.db
    - '__pycache__'
    - '.pytest_cache'
    - '*.pyc'

resources:
  apps:
    preboard:
      name: 'preboard'
      source_code_path: .
      description: 'Preboarding Q&A buffer for signed-but-not-started hires'
      config:
        command: ['streamlit', 'run', 'app.py']
        env:
          - name: 'STREAMLIT_GATHER_USAGE_STATS'
            value: 'false'
          - name: 'DATABRICKS_FM_ENDPOINT'
            value: 'databricks-meta-llama-3-3-70b-instruct'
          - name: 'DATABRICKS_CATALOG'
            value: 'workspace'
          - name: 'DATABRICKS_SCHEMA'
            value: 'preboard'
          - name: 'PREBOARD_AUTH_SECRET'
            value_from: 'auth_secret'
      resources:
        - name: 'auth_secret'
          secret:
            scope: 'preboard'
            key: 'auth_secret'
            permission: 'READ'
        - name: 'fm_chat'
          serving_endpoint:
            name: 'databricks-meta-llama-3-3-70b-instruct'
            permission: 'CAN_QUERY'
        - name: 'fm_embeddings'
          serving_endpoint:
            name: 'databricks-gte-large-en'
            permission: 'CAN_QUERY'
        - name: 'sql_warehouse'
          sql_warehouse:
            id: '43f29df3c2e0da1d'
            permission: 'CAN_USE'
        # PR12/NOTES.md §19: offer_chunks (PR3) is dropped — converged onto Emre's
        # frontend schema (document_chunks/company_documents/department_contacts),
        # not a second parallel table.
        - name: 'document_chunks_table'
          uc_securable:
            securable_full_name: 'workspace.preboard.document_chunks'
            securable_type: 'TABLE'
            permission: 'SELECT'
        - name: 'company_documents_table'
          uc_securable:
            securable_full_name: 'workspace.preboard.company_documents'
            securable_type: 'TABLE'
            permission: 'SELECT'
        - name: 'department_contacts_table'
          uc_securable:
            securable_full_name: 'workspace.preboard.department_contacts'
            securable_type: 'TABLE'
            permission: 'SELECT'

targets:
  dev:
    mode: development
    default: true
